<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F0EAE1"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA9CD0"/>
      <stop offset="100%" stop-color="#9B7BB4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FB391"/>
      <stop offset="100%" stop-color="#4A8B6E"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Character group -->
  <g transform="translate(0, 15)">
    <!-- Cute Sprout Leaf Body (Pastel Lilac) -->
    <path d="M 256 85 C 135 85, 105 235, 105 325 C 105 395, 165 425, 256 425 C 347 425, 407 395, 407 325 C 407 235, 377 85, 256 85 Z" fill="url(#leafGrad)"/>

    <!-- Small Leaf Sprout Top -->
