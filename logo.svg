    <!-- Cute Heart/Flower Accent -->
    <path d="M 355 135 C 355 125, 345 115, 335 125 C 325 115, 315 125, 315 135 C 315 150, 335 165, 335 165 C 335 165, 355 150, 355 135 Z" fill="url(#accentGrad)"/>

    <!-- Face -->
    <circle cx="205" cy="265" r="14" fill="#24382E"/>
    <circle cx="307" cy="265" r="14" fill="#24382E"/>
    <circle cx="209" cy="260" r="5" fill="#FFFFFF"/>
    <circle cx="311" cy="260" r="5" fill="#FFFFFF"/>

    <ellipse cx="178" cy="290" rx="16" ry="10" fill="#F0B2C0" opacity="0.7"/>
    <ellipse cx="334" cy="290" rx="16" ry="10" fill="#F0B2C0" opacity="0.7"/>

    <path d="M 236 290 Q 256 314 276 290" stroke="#24382E" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
